services:
  migrate:
    build:
      context: ./Backend/fastapi_app
    command: ["python", "-m", "ingestion.migrate"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ALEMBIC_ADOPT_EXISTING_SCHEMA: ${ALEMBIC_ADOPT_EXISTING_SCHEMA:-false}

  backend:
    build:
      context: ./Backend/fastapi_app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-https://api.clerk.com/v1/jwks}
      CLERK_JWT_ISSUER: ${CLERK_JWT_ISSUER:-}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      ENSURE_SCHEMA_ON_STARTUP: "false"
      INSTAGRAM_IMPORTS_ENABLED: ${INSTAGRAM_IMPORTS_ENABLED:-false}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      USDA_FDC_API_KEY: ${USDA_FDC_API_KEY:-}
    volumes:
      - ./Backend/fastapi_app:/app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./Backend/fastapi_app
    command: ["python", "-m", "ingestion.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INSTAGRAM_IMPORTS_ENABLED: ${INSTAGRAM_IMPORTS_ENABLED:-false}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      USDA_FDC_API_KEY: ${USDA_FDC_API_KEY:-}
      RECIPE_CLASSIFIER_MODEL: ${RECIPE_CLASSIFIER_MODEL:-gpt-5.6-luna}
      RECIPE_EXTRACTOR_MODEL: ${RECIPE_EXTRACTOR_MODEL:-gpt-5.6-terra}
      RECIPE_TRANSCRIPTION_MODEL: ${RECIPE_TRANSCRIPTION_MODEL:-gpt-4o-transcribe}
      RECIPE_IMPORT_POST_CONCURRENCY: ${RECIPE_IMPORT_POST_CONCURRENCY:-3}
      RECIPE_IMPORT_POLL_SECONDS: ${RECIPE_IMPORT_POLL_SECONDS:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_started

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
