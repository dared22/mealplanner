name: CD Heroku

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
      HEROKU_APP_BACKEND: ${{ secrets.HEROKU_APP_BACKEND }}
      HEROKU_APP_FRONTEND: ${{ secrets.HEROKU_APP_FRONTEND }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Heroku secrets
        run: |
          {
            printf 'HEROKU_API_KEY=%s\n' "$(printf %s "$HEROKU_API_KEY" | tr -d '\r\n')"
            printf 'HEROKU_EMAIL=%s\n' "$(printf %s "$HEROKU_EMAIL" | tr -d '\r\n')"
            printf 'HEROKU_APP_BACKEND=%s\n' "$(printf %s "$HEROKU_APP_BACKEND" | tr -d '\r\n')"
            printf 'HEROKU_APP_FRONTEND=%s\n' "$(printf %s "$HEROKU_APP_FRONTEND" | tr -d '\r\n')"
          } >> "$GITHUB_ENV"

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Authenticate Heroku CLI
        run: |
          cat <<EOF > ~/.netrc
          machine api.heroku.com
            login $HEROKU_EMAIL
            password $HEROKU_API_KEY
          machine git.heroku.com
            login $HEROKU_EMAIL
            password $HEROKU_API_KEY
          EOF
          chmod 600 ~/.netrc

      # Optional first run: verify case-sensitive paths on Linux runner
      - name: Sanity check paths
        run: |
          pwd && ls -la
          ls -la Backend || true
          ls -la Backend/fastapi_app || true
          ls -la Frontend || true

      - name: Login to Heroku Container Registry
        run: heroku container:login

      - name: Validate backend runtime configuration
        run: |
          required=(DATABASE_URL OPENAI_API_KEY INSTAGRAM_IMPORTS_ENABLED)
          importer_enabled="$(heroku config:get INSTAGRAM_IMPORTS_ENABLED -a "$HEROKU_APP_BACKEND")"
          case "${importer_enabled,,}" in
            1|true|yes)
              required+=(
                META_ACCESS_TOKEN
                META_IG_USER_ID
                CLOUDINARY_CLOUD_NAME
                CLOUDINARY_API_KEY
                CLOUDINARY_API_SECRET
              )
              ;;
          esac

          missing=()
          for key in "${required[@]}"; do
            if [[ -z "$(heroku config:get "$key" -a "$HEROKU_APP_BACKEND")" ]]; then
              missing+=("$key")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing backend config vars: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      # ---------- Backend ----------
      - name: Set container stack (backend)
        run: heroku stack:set container -a "$HEROKU_APP_BACKEND" 

      - name: Build backend image
        run: |
          docker build \
            -f Backend/fastapi_app/Dockerfile \
            -t registry.heroku.com/$HEROKU_APP_BACKEND/web \
            Backend/fastapi_app

      - name: Push backend image
        run: |
          docker push registry.heroku.com/$HEROKU_APP_BACKEND/web
          docker tag \
            registry.heroku.com/$HEROKU_APP_BACKEND/web \
            registry.heroku.com/$HEROKU_APP_BACKEND/worker
          docker tag \
            registry.heroku.com/$HEROKU_APP_BACKEND/web \
            registry.heroku.com/$HEROKU_APP_BACKEND/release
          docker push registry.heroku.com/$HEROKU_APP_BACKEND/worker
          docker push registry.heroku.com/$HEROKU_APP_BACKEND/release

      - name: Release backend
        run: heroku container:release web worker release -a $HEROKU_APP_BACKEND

      - name: Clear one-time schema adoption flag
        run: heroku config:unset ALEMBIC_ADOPT_EXISTING_SCHEMA -a "$HEROKU_APP_BACKEND" || true

      - name: Scale importer worker
        run: heroku ps:scale worker=1 -a "$HEROKU_APP_BACKEND"

      - name: Verify backend health
        run: |
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "https://${HEROKU_APP_BACKEND}.herokuapp.com/health"

      # ---------- Frontend ----------
      - name: Build frontend image
        env:
          VITE_API_URL: https://mealplanner-backend-d6ab87c9c7b5.herokuapp.com
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          docker build \
            --build-arg VITE_API_URL=$VITE_API_URL \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY \
            -f Frontend/Dockerfile \
            -t registry.heroku.com/$HEROKU_APP_FRONTEND/web \
            Frontend

      - name: Push frontend image
        run: docker push registry.heroku.com/$HEROKU_APP_FRONTEND/web

      - name: Release frontend
        run: heroku container:release web -a $HEROKU_APP_FRONTEND
