name: CD Heroku

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mealplanner_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mealplanner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r Backend/fastapi_app/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q Backend/fastapi_app

      - name: Test backend guardrails
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mealplanner_test
        run: pytest Backend/fastapi_app/tests

      - name: Bootstrap a fresh database with Alembic
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mealplanner_test
        working-directory: Backend/fastapi_app
        run: |
          alembic upgrade head
          alembic current --verbose

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Verify frontend
        working-directory: Frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
      HEROKU_APP_BACKEND: ${{ secrets.HEROKU_APP_BACKEND }}
      HEROKU_APP_FRONTEND: ${{ secrets.HEROKU_APP_FRONTEND }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Heroku secrets
        run: |
          {
            printf 'HEROKU_API_KEY=%s\n' "$(printf %s "$HEROKU_API_KEY" | tr -d '\r\n')"
            printf 'HEROKU_EMAIL=%s\n' "$(printf %s "$HEROKU_EMAIL" | tr -d '\r\n')"
            printf 'HEROKU_APP_BACKEND=%s\n' "$(printf %s "$HEROKU_APP_BACKEND" | tr -d '\r\n')"
            printf 'HEROKU_APP_FRONTEND=%s\n' "$(printf %s "$HEROKU_APP_FRONTEND" | tr -d '\r\n')"
          } >> "$GITHUB_ENV"

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Authenticate Heroku CLI
        run: |
          cat <<EOF > ~/.netrc
          machine api.heroku.com
            login $HEROKU_EMAIL
            password $HEROKU_API_KEY
          machine git.heroku.com
            login $HEROKU_EMAIL
            password $HEROKU_API_KEY
          EOF
          chmod 600 ~/.netrc

      - name: Login to Heroku Container Registry
        run: heroku container:login

      - name: Resolve Heroku app URLs
        run: |
          backend_url=$(heroku apps:info --app "$HEROKU_APP_BACKEND" --json | python3 -c 'import json, sys; print(json.load(sys.stdin)["web_url"].rstrip("/"))')
          frontend_url=$(heroku apps:info --app "$HEROKU_APP_FRONTEND" --json | python3 -c 'import json, sys; print(json.load(sys.stdin)["web_url"].rstrip("/"))')
          echo "HEROKU_BACKEND_URL=$backend_url" >> "$GITHUB_ENV"
          echo "HEROKU_FRONTEND_URL=$frontend_url" >> "$GITHUB_ENV"

      # ---------- Backend ----------
      - name: Set container stack (backend)
        run: heroku stack:set container -a "$HEROKU_APP_BACKEND" 

      - name: Build deployment images
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          docker build \
            -f Backend/fastapi_app/Dockerfile \
            -t registry.heroku.com/$HEROKU_APP_BACKEND/web \
            Backend/fastapi_app
          docker build \
            --build-arg VITE_API_URL="$HEROKU_BACKEND_URL" \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY \
            -f Frontend/Dockerfile \
            -t registry.heroku.com/$HEROKU_APP_FRONTEND/web \
            Frontend

      - name: Push backend image
        run: docker push registry.heroku.com/$HEROKU_APP_BACKEND/web

      - name: Release backend
        run: heroku container:release web -a $HEROKU_APP_BACKEND

      - name: Run Alembic migrations
        run: heroku run "alembic upgrade head" -a $HEROKU_APP_BACKEND

      - name: Verify backend health
        run: |
          curl --fail --retry 5 --retry-connrefused --retry-delay 5 \
            "$HEROKU_BACKEND_URL/health"

      # ---------- Frontend ----------
      - name: Push frontend image
        run: docker push registry.heroku.com/$HEROKU_APP_FRONTEND/web

      - name: Release frontend
        run: heroku container:release web -a $HEROKU_APP_FRONTEND

      - name: Verify frontend root
        run: |
          curl --fail --retry 5 --retry-connrefused --retry-delay 5 \
            "$HEROKU_FRONTEND_URL/"
